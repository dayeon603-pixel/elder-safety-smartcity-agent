<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><title>고령자 안전 스마트도시 에이전트 · 시연판</title>
<script>
  // GitHub Pages SPA fallback: /<repo>/twin -> /<repo>/#/twin (HashRouter), so deep links to /twin and /terminal work.
  (function () {
    var seg = location.pathname.split("/");
    var repo = seg[1] ? "/" + seg[1] + "/" : "/";
    var rest = location.pathname.slice(repo.length).replace(/\/+$/, "");
    location.replace(repo + "#/" + rest + location.search + (location.hash && location.hash.length > 1 && location.hash.indexOf("#/") !== 0 ? "" : ""));
  })();
</script></head><body></body></html>
